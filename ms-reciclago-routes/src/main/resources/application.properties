server.port=8084

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/reciclago_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:reciclago}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:reciclagopass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
