server.port=8081

# Configuración de Base de Datos (PostgreSQL por defecto, compatible con Oracle)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reciclago_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:reciclago}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:reciclagopass}

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ejemplo de conexión Oracle (Descomentar para usar Oracle en vez de PostgreSQL):
# spring.datasource.url=jdbc:oracle:thin:@localhost:1521/reciclago_db
