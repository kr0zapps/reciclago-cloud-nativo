  <!-- Web Cryptography Polyfill for MSAL in HTTP contexts (AWS S3 static website hosting) -->
  <script>
    function rightRotate(v, a) {
      return (v >>> a) | (v << (32 - a));
    }

    function generateKAndHash() {
      var hash = [];
      var k = [];
      var primeCounter = 0;
      var isComposite = {};
      var candidate = 2;
      var mathPow = Math.pow;
      var maxWord = mathPow(2, 32);

      while (primeCounter < 64) {
        if (!isComposite[candidate]) {
          for (var i = 0; i < 313; i += candidate) {
            isComposite[i] = candidate;
          }
          hash[primeCounter] = Math.trunc(mathPow(candidate, 0.5) * maxWord);
          k[primeCounter] = Math.trunc(mathPow(candidate, 1 / 3) * maxWord);
          primeCounter++;
        }
        candidate++;
      }
      return { hash: hash, k: k };
    }

    function processChunk(w, hash, k) {
      var oldHash = hash.slice(0);
      for (var i = 0; i < 64; i++) {
        if (i >= 16) {
          var w15 = w[i - 15];
          var w2 = w[i - 2];
          var s0 = rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3);
          var s1 = rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10);
          w[i] = Math.trunc(w[i - 16] + s0 + w[i - 7] + s1);
        }
        var e = hash[4];
        var ch = (e & hash[5]) ^ ((~e) & hash[6]);
        var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ch + k[i] + w[i];
        var a = hash[0];
        var maj = (a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]);
        var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + maj;
        hash = [Math.trunc(temp1 + temp2)].concat(hash);
        hash[4] = Math.trunc(hash[4] + temp1);
      }
      for (var j = 0; j < 8; j++) {
        hash[j] = Math.trunc(hash[j] + oldHash[j]);
      }
      return hash;
    }

    function sha256(ascii) {
      var constants = generateKAndHash();
      var hash = constants.hash;
      var k = constants.k;
      var asciiBitLength = ascii.length * 8;
      var wordsCount = ((asciiBitLength + 64 >>> 9) << 4) + 15;
      var words = new Array(wordsCount + 1).fill(0);

      for (var i = 0; i < ascii.length; i++) {
        var code = typeof ascii === 'string' ? ascii.codePointAt(i) : ascii[i];
        words[i >> 2] |= code << (24 - (i % 4) * 8);
      }
      words[ascii.length >> 2] |= 0x80 << (24 - (ascii.length % 4) * 8);
      words[wordsCount] = asciiBitLength;

      for (var j = 0; j < words.length; j += 16) {
        hash = processChunk(words.slice(j, j + 16), hash, k);
      }
      var buffer = new ArrayBuffer(32);
      var view = new DataView(buffer);
      for (var m = 0; m < 8; m++) {
        view.setUint32(m * 4, hash[m], false);
      }
      return buffer;
    }

    (function() {
      if (typeof window === 'undefined') return;
      if (window.crypto && window.crypto.getRandomValues && window.crypto.subtle) {
        return;
      }
      if (!window.crypto) {
        window.crypto = {};
      }
      if (!window.crypto.getRandomValues) {
        window.crypto.getRandomValues = function(arr) {
          var winCrypto = window.crypto || window.msCrypto;
          if (winCrypto && winCrypto.getRandomValues && winCrypto.getRandomValues !== this) {
            return winCrypto.getRandomValues(arr);
          }
          return arr;
        };
      }
      if (!window.crypto.subtle) {
        var subtlePolyfill = {
          digest: function(alg, data) {
            var uint8 = data instanceof Uint8Array ? data : new Uint8Array(data.buffer || data);
            return Promise.resolve(sha256(uint8));
          },
          generateKey: function() { return Promise.resolve({}); },
          exportKey: function() { return Promise.resolve({}); },
          importKey: function() { return Promise.resolve({}); },
          sign: function() { return Promise.resolve(new ArrayBuffer(0)); },
          verify: function() { return Promise.resolve(true); },
          encrypt: function() { return Promise.resolve(new ArrayBuffer(0)); },
          decrypt: function() { return Promise.resolve(new ArrayBuffer(0)); }
        };

        try {
          Object.defineProperty(window.crypto, 'subtle', { value: subtlePolyfill, configurable: true, writable: true });
        } catch(e) {
          // Property might be read-only in strict environments, fallback silently
        }
        try {
          var proto = Object.getPrototypeOf(window.crypto);
          if (proto) {
            Object.defineProperty(proto, 'subtle', { get: function() { return subtlePolyfill; }, configurable: true });
          }
        } catch(e) {
          // Prototype manipulation may fail on restricted platforms
        }
        if (!window.crypto.subtle) {
          try {
            window.crypto.subtle = subtlePolyfill;
          } catch(e) {
            // Direct assignment fallback
          }
        }
      }
    })();
  </script>
