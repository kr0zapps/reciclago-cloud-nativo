  <!-- Web Cryptography Polyfill for MSAL in HTTP contexts (AWS S3 static website hosting) -->
  <script>
    (function() {
      if (typeof window === 'undefined') return;
      // Preservar Web Cryptography API nativo en contextos seguros (HTTPS y localhost)
      if (window.crypto && window.crypto.getRandomValues && window.crypto.subtle) {
        return;
      }
      if (!window.crypto) {
        window.crypto = {};
      }
      if (!window.crypto.getRandomValues) {
        window.crypto.getRandomValues = function(arr) {
          for (var i = 0; i < arr.length; i++) {
            arr[i] = Math.floor(Math.random() * 256);
          }
          return arr;
        };
      }
      if (!window.crypto.subtle) {
        function sha256(ascii) {
          function rightRotate(v, a) { return (v >>> a) | (v << (32 - a)); }
          var mathPow = Math.pow;
          var maxWord = mathPow(2, 32);
          var i, j;
          var words = [];
          var asciiBitLength = ascii.length * 8;
          var hash = [];
          var k = [];
          var primeCounter = 0;
          var isComposite = {};
          for (var candidate = 2; primeCounter < 64; candidate++) {
            if (!isComposite[candidate]) {
              for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
              hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
              k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
            }
          }
          var wordsCount = ((asciiBitLength + 64 >>> 9) << 4) + 15;
          for (i = 0; i < wordsCount; i++) words[i] = 0;
          for (i = 0; i < ascii.length; i++) {
            words[i >> 2] |= (typeof ascii === 'string' ? ascii.charCodeAt(i) : ascii[i]) << (24 - (i % 4) * 8);
          }
          words[ascii.length >> 2] |= 0x80 << (24 - (ascii.length % 4) * 8);
          words[wordsCount] = asciiBitLength;
          for (j = 0; j < words.length; j += 16) {
            var w = words.slice(j, j + 16);
            var oldHash = hash.slice(0);
            for (i = 0; i < 64; i++) {
              var w15 = w[i - 15], w2 = w[i - 2];
              var a = hash[0], e = hash[4];
              var temp1 = hash[7]
                + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                + ((e & hash[5]) ^ ((~e) & hash[6]))
                + k[i]
                + (w[i] = (i < 16) ? w[i] : (
                    w[i - 16]
                    + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                    + w[i - 7]
                    + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                  ) | 0
                );
              var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
              hash = [(temp1 + temp2) | 0].concat(hash);
              hash[4] = (hash[4] + temp1) | 0;
            }
            for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
          }
          var buffer = new ArrayBuffer(32);
          var view = new DataView(buffer);
          for (i = 0; i < 8; i++) view.setUint32(i * 4, hash[i], false);
          return buffer;
        }

        var subtlePolyfill = {
          digest: function(alg, data) {
            var uint8 = data instanceof Uint8Array ? data : new Uint8Array(data.buffer || data);
            return Promise.resolve(sha256(uint8));
          },
          generateKey: function() { return Promise.resolve({}); },
          exportKey: function() { return Promise.resolve({}); },
          importKey: function() { return Promise.resolve({}); },
          sign: function() { return Promise.resolve(new ArrayBuffer(0)); },
          verify: function() { return Promise.resolve(true); },
          encrypt: function() { return Promise.resolve(new ArrayBuffer(0)); },
          decrypt: function() { return Promise.resolve(new ArrayBuffer(0)); }
        };

        try {
          Object.defineProperty(window.crypto, 'subtle', { value: subtlePolyfill, configurable: true, writable: true });
        } catch(e) {}
        try {
          var proto = Object.getPrototypeOf(window.crypto);
          if (proto) Object.defineProperty(proto, 'subtle', { get: function() { return subtlePolyfill; }, configurable: true });
        } catch(e) {}
        if (!window.crypto.subtle) {
          try { window.crypto.subtle = subtlePolyfill; } catch(e) {}
        }
      }
    })();
  </script>
