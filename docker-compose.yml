services:
  # ==========================================
  # 1. BASE DE DATOS (PostgreSQL / Oracle)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: reciclago-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reciclago_db}
      POSTGRES_USER: ${POSTGRES_USER:-reciclago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reciclagopass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reciclago} -d ${POSTGRES_DB:-reciclago_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reciclago-net

  # Opción Oracle DB Free (Descomentar si se prefiere Oracle para desarrollo local)
  # oracle:
  #   image: gvenzl/oracle-free:slim
  #   container_name: reciclago-oracle
  #   restart: unless-stopped
  #   ports:
  #     - "1521:1521"
  #   environment:
  #     ORACLE_DATABASE: reciclago_db
  #     APP_USER: reciclago
  #     APP_USER_PASSWORD: reciclagopass
  #   volumes:
  #     - oracle_data:/opt/oracle/oradata
  #   healthcheck:
  #     test: ["CMD", "healthcheck.sh"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 5
  #   networks:
  #     - reciclago-net

  # ==========================================
  # 2. CLÚSTER DE RABBITMQ (con Management UI)
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: reciclago-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # Puerto AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reciclago-net

  # ==========================================
  # 3. ENTORNO KAFKA (Zookeeper + Kafka Broker)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: reciclago-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reciclago-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: reciclago-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"    # Conexión interna Docker / Broker
      - "29092:29092"  # Connection Listener localhost para clientes externos
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - reciclago-net

  # UI Opcional para inspección visual de Kafka
  # kafka-ui:
  #   image: provectuslabs/kafka-ui:latest
  #   container_name: reciclago-kafka-ui
  #   restart: unless-stopped
  #   depends_on:
  #     - kafka
  #   ports:
  #     - "8085:8080"
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: reciclago-cluster
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  #     KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
  #   networks:
  #     - reciclago-net

networks:
  reciclago-net:
    driver: bridge
    name: reciclago-net

volumes:
  postgres_data:
    driver: local
  # oracle_data:
  #   driver: local
  rabbitmq_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local
