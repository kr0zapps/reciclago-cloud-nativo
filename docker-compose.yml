services:

  postgres:
    image: postgres:16-alpine
    container_name: reciclago-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reciclago_db}
      POSTGRES_USER: ${POSTGRES_USER:-reciclago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reciclagopass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reciclago} -d ${POSTGRES_DB:-reciclago_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reciclago-net

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: reciclago-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # Puerto AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reciclago-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: reciclago-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 2181 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reciclago-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: reciclago-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - reciclago-net

  ms-catalog:
    build:
      context: ./ms-reciclago-catalog
      dockerfile: Dockerfile
    container_name: reciclago-ms-catalog
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reciclago_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-reciclago}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reciclagopass}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reciclago-net
    profiles:
      - apps

  ms-pickups:
    build:
      context: ./ms-reciclago-pickups
      dockerfile: Dockerfile
    container_name: reciclago-ms-pickups
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reciclago_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-reciclago}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reciclagopass}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - reciclago-net
    profiles:
      - apps

  ms-routes:
    build:
      context: ./ms-reciclago-routes
      dockerfile: Dockerfile
    container_name: reciclago-ms-routes
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reciclago_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-reciclago}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reciclagopass}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reciclago-net
    profiles:
      - apps

  ms-bff:
    build:
      context: ./ms-reciclago-bff
      dockerfile: Dockerfile
    container_name: reciclago-ms-bff
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      RECICLAGO_SERVICES_CATALOG_URL: http://ms-catalog:8081
      RECICLAGO_SERVICES_PICKUPS_URL: http://ms-pickups:8083
      RECICLAGO_SERVICES_ROUTES_URL: http://ms-routes:8084
    depends_on:
      - ms-catalog
      - ms-pickups
      - ms-routes
    networks:
      - reciclago-net
    profiles:
      - apps

networks:
  reciclago-net:
    driver: bridge
    name: reciclago-net

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local
