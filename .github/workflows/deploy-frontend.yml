name: Deploy Frontend RecicLaGo to AWS S3

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend-reciclago/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: # Permite ejecutar el despliegue manualmente desde la pestaña Actions en GitHub

jobs:
  build-and-deploy:
    name: Build Angular & Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend-reciclago/package-lock.json'

      - name: 📦 Instalar dependencias
        working-directory: ./frontend-reciclago
        run: npm ci

      - name: 🌐 Inyectar URL del Backend en environment.prod.ts
        working-directory: ./frontend-reciclago
        env:
          APIGW_URL: ${{ secrets.APIGW_URL }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Prioridad: APIGW_URL (API Gateway) > EC2_HOST (acceso directo)
          APIGW_CLEAN=$(echo "$APIGW_URL" | tr -d '\r\n ')
          EC2_CLEAN=$(echo "$EC2_HOST" | tr -d '\r\n ')

          if [ -n "$APIGW_CLEAN" ]; then
            # Usar URL del API Gateway (producción correcta con JWT Authorizer)
            BACKEND_URL="$APIGW_CLEAN"
            echo "✅ Usando API Gateway URL como backend"
          elif [ -n "$EC2_CLEAN" ]; then
            # Fallback: acceso directo al EC2 (sin API Gateway)
            BACKEND_URL="http://${EC2_CLEAN}:8080"
            echo "⚠️ APIGW_URL no definido. Usando EC2 directamente como fallback."
          else
            echo "❌ Ni APIGW_URL ni EC2_HOST están definidos. El frontend usará el placeholder."
          fi

          if [ -n "$BACKEND_URL" ]; then
            sed -i "s|BACKEND_API_URL_PLACEHOLDER|${BACKEND_URL}|g" src/environments/environment.prod.ts
            echo "✅ URL del backend inyectada correctamente."
          fi


      - name: 🏗️ Compilar Frontend Angular en modo Producción
        working-directory: ./frontend-reciclago
        run: npm run build

      - name: 🔑 Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Requerido para cuentas AWS Academy / Learner Lab
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: 🚀 Sincronizar archivos a AWS S3 Bucket
        run: |
          BUCKET="${{ secrets.S3_BUCKET_NAME || 'reciclago-frontend-puertovaras' }}"
          aws s3 sync ./frontend-reciclago/dist/frontend-reciclago/browser s3://$BUCKET --delete
          for route in dashboard login pickups catalog reports audit auth; do
            aws s3 cp ./frontend-reciclago/dist/frontend-reciclago/browser/index.html s3://$BUCKET/$route --content-type text/html
          done
          echo "✅ Despliegue a S3 completado con éxito."
