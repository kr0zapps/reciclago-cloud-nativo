name: Deploy Backend RecicLaGo to AWS ECR & EC2

on:
  push:
    branches:
      - main
      - master
      - dev2-backend-core
    paths:
      - 'ms-reciclago-bff/**'
      - 'ms-reciclago-catalog/**'
      - 'ms-reciclago-pickups/**'
      - 'ms-reciclago-routes/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions de GitHub

jobs:
  build-and-push-ecr:
    name: 🐳 Build Docker Images & Push to AWS ECR
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔑 Configurar credenciales de AWS Backend (DEV 2)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_BACKEND_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BACKEND_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_BACKEND_SESSION_TOKEN || secrets.AWS_SESSION_TOKEN }} # Requerido para cuentas AWS Academy / Learner Lab
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: 📦 Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Asegurar existencia de Repositorios en ECR
        run: |
          REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          REPOS=("reciclago/ms-bff" "reciclago/ms-catalog" "reciclago/ms-pickups" "reciclago/ms-routes")
          for repo in "${REPOS[@]}"; do
            echo "Verificando repositorio ECR: $repo"
            aws ecr describe-repositories --repository-names "$repo" --region "$REGION" > /dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$repo" --region "$REGION"
          done

      - name: 🏗️ Compilar y Publicar Microservicio BFF
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Construyendo ms-bff..."
          docker build -t "$REGISTRY/reciclago/ms-bff:latest" -t "$REGISTRY/reciclago/ms-bff:${{ github.sha }}" ./ms-reciclago-bff
          docker push "$REGISTRY/reciclago/ms-bff:latest"
          docker push "$REGISTRY/reciclago/ms-bff:${{ github.sha }}"

      - name: 🏗️ Compilar y Publicar Microservicio Catálogo
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Construyendo ms-catalog..."
          docker build -t "$REGISTRY/reciclago/ms-catalog:latest" -t "$REGISTRY/reciclago/ms-catalog:${{ github.sha }}" ./ms-reciclago-catalog
          docker push "$REGISTRY/reciclago/ms-catalog:latest"
          docker push "$REGISTRY/reciclago/ms-catalog:${{ github.sha }}"

      - name: 🏗️ Compilar y Publicar Microservicio Retiros
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Construyendo ms-pickups..."
          docker build -t "$REGISTRY/reciclago/ms-pickups:latest" -t "$REGISTRY/reciclago/ms-pickups:${{ github.sha }}" ./ms-reciclago-pickups
          docker push "$REGISTRY/reciclago/ms-pickups:latest"
          docker push "$REGISTRY/reciclago/ms-pickups:${{ github.sha }}"

      - name: 🏗️ Compilar y Publicar Microservicio Rutas
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Construyendo ms-routes..."
          docker build -t "$REGISTRY/reciclago/ms-routes:latest" -t "$REGISTRY/reciclago/ms-routes:${{ github.sha }}" ./ms-reciclago-routes
          docker push "$REGISTRY/reciclago/ms-routes:latest"
          docker push "$REGISTRY/reciclago/ms-routes:${{ github.sha }}"

      - name: ✅ Resumen de Publicación ECR
        run: |
          echo "Todas las imágenes Docker de backend han sido publicadas exitosamente en Amazon ECR."

  deploy-ec2:
    name: 🚀 Deploy to AWS EC2 via SSH
    needs: build-and-push-ecr
    runs-on: ubuntu-latest
    continue-on-error: true # Permite que el pipeline sea exitoso aun si la instancia EC2 esta detenida o en creacion

    steps:
      - name: ℹ️ Verificar disponibilidad de credenciales EC2
        id: check-ec2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ]; then
            echo "✅ Parámetros de EC2 detectados. Procediendo con el despliegue..."
            echo "ec2_ready=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Secretos EC2_HOST o EC2_SSH_KEY no definidos. Omitiendo despliegue en servidor EC2 (imágenes ya disponibles en ECR)."
            echo "ec2_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: 📥 Clonar repositorio
        if: steps.check-ec2.outputs.ec2_ready == 'true'
        uses: actions/checkout@v4

      - name: 📁 Transferir docker-compose.yml a la instancia EC2
        if: steps.check-ec2.outputs.ec2_ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'docker-compose.yml'
          target: '~/reciclago/'

      - name: 🚀 Ejecutar Despliegue en EC2 vía SSH
        if: steps.check-ec2.outputs.ec2_ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ needs.build-and-push-ecr.outputs.registry }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BACKEND_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BACKEND_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_BACKEND_SESSION_TOKEN || secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION
          script: |
            set -e
            echo "Conectado exitosamente a la instancia EC2..."

            # ── Instalar Docker si no está presente ──────────────────────────
            if ! command -v docker &> /dev/null; then
              echo "🐳 Docker no encontrado. Instalando..."
              sudo apt-get update -qq
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -qq
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker ubuntu
              sudo systemctl enable docker
              sudo systemctl start docker
              echo "✅ Docker instalado correctamente."
            else
              echo "✅ Docker ya está instalado: $(docker --version)"
            fi

            # ── Instalar AWS CLI v2 si no está presente ──────────────────────
            if ! command -v aws &> /dev/null; then
              echo "☁️ AWS CLI v2 no encontrado. Instalando..."
              sudo apt-get install -y unzip curl -qq
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
              unzip -q /tmp/awscliv2.zip -d /tmp/
              sudo /tmp/aws/install
              rm -rf /tmp/awscliv2.zip /tmp/aws
              echo "✅ AWS CLI v2 instalado: $(aws --version)"
            else
              echo "✅ AWS CLI ya está instalado: $(aws --version)"
            fi

            mkdir -p ~/reciclago
            cd ~/reciclago

            # ── Configurar .env para docker compose ───────────────────────────
            cat <<EOF > .env
            COMPOSE_PROFILES=apps
            POSTGRES_DB=reciclago_db
            POSTGRES_USER=reciclago
            POSTGRES_PASSWORD=reciclagopass
            RABBITMQ_USER=guest
            RABBITMQ_PASS=guest
            ECR_REGISTRY=$REGISTRY
            IMAGE_TAG=latest
            EOF

            # ── Autenticar Docker con Amazon ECR ──────────────────────────────
            export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            export AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN"
            export AWS_DEFAULT_REGION="$AWS_REGION"

            echo "🔐 Registrando en ECR: $REGISTRY (región: $AWS_REGION)"

            if [ -z "$REGISTRY" ]; then
              echo "❌ REGISTRY está vacío. Verificar output del job build-and-push-ecr."
              exit 1
            fi

            ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
            if [ -z "$ECR_PASSWORD" ]; then
              echo "❌ No se pudo obtener token ECR. Verificar credenciales AWS (pueden haber expirado)."
              exit 1
            fi

            echo "$ECR_PASSWORD" | sudo docker login --username AWS --password-stdin "$REGISTRY"
            echo "✅ Login en ECR exitoso."

            echo "Descargando imágenes actualizadas de ECR..."
            sudo docker compose pull ms-bff ms-catalog ms-pickups ms-routes || true

            echo "Iniciando infraestructura y microservicios con Docker Compose..."
            sudo docker compose up -d

            echo "Limpiando imágenes antiguas en desuso..."
            sudo docker image prune -f || true

            echo "Estado actual de los contenedores:"
            sudo docker compose ps
            echo "✅ Despliegue completado con éxito en EC2."
